name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '{0}-{1}' -f (Get-Date -Format 'yyyy.MM.dd'), $env:GITHUB_RUN_NUMBER
          }
          $buildTime = (Get-Date).ToString('yyyy-MM-ddTHH:mm:sszzz')
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "BUILD_TIME=$buildTime" >> $env:GITHUB_ENV
          Write-Host "Version:    $version"
          Write-Host "Build time: $buildTime"
      - name: Build
        shell: cmd
        env:
          CI: "true"
          OPENMD_SKIP_TESTS: "true"
        run: build.bat
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash OpenMD.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenMD.exe" | Set-Content -Encoding ascii -NoNewline OpenMD.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenMD-${{ env.BUILD_VERSION }}
          path: |
            OpenMD.exe
            OpenMD.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME OpenMD.exe OpenMD.exe.sha256 --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME OpenMD.exe OpenMD.exe.sha256 --title $env:GITHUB_REF_NAME --generate-notes
          }
